[project]
name = "devharness"
version = "0.1.0"
description = "Evidence-first local control and review core for agentic development"
requires-python = ">=3.12"
dependencies = []

[tool.devharness]
runtime = "stdlib-only"
sqlite_journal_mode = "DELETE"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The Dashboard ships HTML/CSS/JS next to its Python. Without this the wheel
# would carry only the modules and `devharness dashboard` would start a server
# with nothing to serve.
[tool.setuptools.package-data]
"devharness.dashboard" = ["web/*.html", "web/*.css", "web/*.js"]
